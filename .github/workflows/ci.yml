---
name: "Template Quality & Generation CI"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  test-template:
    name: "Test Copier Template Generation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v3"
        with:
          enable-cache: false

      - name: "Install Dependencies"
        run: |
          uv sync --all-extras

      - name: "Run Linters (pre-commit)"
        run: |
          uv run pre-commit run --all-files

      - name: "Run Pytest Template Suite"
        run: |
          uv run pytest -v
